name: Build Wavely Desktop (Windows & macOS DMG)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Package macOS (.DMG & .ZIP)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Package macOS DMG & ZIP
        run: npx electron-builder --mac dmg zip -c.mac.identity=null --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy and Standardize File Names
        run: |
          mkdir -p release_out
          cp release/*.dmg release_out/Wavely-Mac.dmg || true
          cp release/*.zip release_out/Wavely-Mac.zip || true
          cp release/*.dmg release_out/ || true
          cp release/*.zip release_out/ || true
          ls -la release_out/

      - name: Upload Artifacts to Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: Wavely-macOS-DMG
          path: release_out/*

      - name: Publish to GitHub Releases Assets
        run: |
          gh release create v1.0.7 release_out/* --title "Wavely Desktop v1.0.7" --notes "Official macOS DMG and Windows release" --clobber || gh release upload v1.0.7 release_out/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Package Windows (.EXE & .ZIP)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Package Windows Installer (.exe) & Portable (.zip)
        run: npx electron-builder --win nsis zip --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy and Standardize File Names
        run: |
          mkdir -p release_out
          Copy-Item release/*.exe release_out/Wavely-Setup.exe -ErrorAction SilentlyContinue
          Copy-Item release/*.zip release_out/Wavely-Portable.zip -ErrorAction SilentlyContinue
          Copy-Item release/*.exe release_out/ -ErrorAction SilentlyContinue
          Copy-Item release/*.zip release_out/ -ErrorAction SilentlyContinue
          Get-ChildItem release_out

      - name: Upload Artifacts to Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: Wavely-Windows-Builds
          path: release_out/*

      - name: Publish to GitHub Releases Assets
        run: |
          gh release create v1.0.7 (Get-ChildItem release_out\* | Select-Object -ExpandProperty FullName) --title "Wavely Desktop v1.0.7" --notes "Official macOS DMG and Windows release" --clobber; if ($LASTEXITCODE -ne 0) { gh release upload v1.0.7 (Get-ChildItem release_out\* | Select-Object -ExpandProperty FullName) --clobber }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
