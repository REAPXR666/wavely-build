name: Build Wavely Desktop (Windows & macOS DMG)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Package macOS (.DMG & .ZIP)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Package macOS DMG & ZIP
        run: npx electron-builder --mac dmg zip -c.mac.identity=null --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename Release Files
        run: |
          mkdir -p release_out
          cp release/*.dmg release_out/Wavely-Mac.dmg || true
          cp release/*.zip release_out/Wavely-Mac.zip || true

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wavely-macOS-DMG
          path: release_out/*

      - name: Release to GitHub (If Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release_out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Package Windows (.EXE & .ZIP)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Package Windows Installer (.exe) & Portable (.zip)
        run: npx electron-builder --win nsis zip --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename Windows Files
        run: |
          mkdir release_out
          Copy-Item release/*.exe release_out/Wavely-Setup.exe -ErrorAction SilentlyContinue
          Copy-Item release/*.zip release_out/Wavely-Portable.zip -ErrorAction SilentlyContinue

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wavely-Windows-Builds
          path: release_out/*

      - name: Release to GitHub (If Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release_out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
