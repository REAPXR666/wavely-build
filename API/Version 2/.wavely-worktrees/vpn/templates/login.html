{% extends "base.html" %}
{% block content %}
<section id="tab-login" class="tab-content active">
    <div class="form-container-card">
        <div class="card form-card">
            <h2>Welcome Back</h2>
            <p class="desc-text">Sign in to manage API keys and view logs.</p>
            <form onsubmit="handleLogin(event)">
                <div class="form-group"><label>Username</label><input type="text" id="login-username" required class="input-form" placeholder="Enter username"></div>
                <div class="form-group"><label>Password</label><input type="password" id="login-password" required class="input-form" placeholder="••••••••"></div>
                <div class="form-error-msg" id="login-error"></div>
                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>
            <p class="form-footer-text">Don't have an account? <a href="/signup">Register here</a></p>
        </div>
    </div>
</section>
{% endblock %}
