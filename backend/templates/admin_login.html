{% extends 'admin_base.html' %}

{% block title %}Login - Splice Pro Admin{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="logo-area">
            <div class="logo-icon">S</div>
            <span class="logo-text">SPLICE PRO ADMIN</span>
        </div>
        <p class="login-subtitle">Authenticate to access admin dashboard</p>

        {% if error %}
        <div class="alert-error">
            <span class="alert-icon">✕</span>
            <span class="alert-msg">{{ error }}</span>
        </div>
        {% endif %}

        <form action="{{ url_for('admin_login') }}" method="POST" class="login-form">
            <div class="form-group">
                <label for="username">Admin Username</label>
                <input type="text" id="username" name="username" placeholder="e.g. Admin" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">
                <span>Access Dashboard</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
